# =============================================================================
# Build and publish the image to Docker Hub on every pushed git tag.
# -----------------------------------------------------------------------------
# Required repository secrets (add these in GitHub > Settings > Secrets and
# variables > Actions):
#   DOCKERHUB_USERNAME  - your Docker Hub username (also the image namespace)
#   DOCKERHUB_TOKEN     - a Docker Hub access token (not your password)
# =============================================================================
name: docker-publish

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image repository. The namespace comes from the DOCKERHUB_USERNAME
          # secret; the repo component is fixed. Change the repo component here
          # if you want a different Docker Hub repository name.
          images: ${{ secrets.DOCKERHUB_USERNAME }}/steam-client-headless-lite
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
