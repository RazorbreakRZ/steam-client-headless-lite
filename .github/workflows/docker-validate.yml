# =============================================================================
# Build-only validation. Builds the image WITHOUT pushing, so intermediate
# changes can be validated. Triggers on pushes to the `validate` branch and on
# pull requests. no-cache ensures the apt layer genuinely re-resolves package
# names against the live Debian archive on each run.
# =============================================================================
name: docker-validate

on:
  push:
    branches:
      - validate
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shellcheck on init scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck root/app/*.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          no-cache: true
          tags: steam-client-headless-lite:validate
