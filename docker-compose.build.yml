# =============================================================================
# docker-compose.build.yml — LOCAL BUILD & STARTUP VALIDATION
# -----------------------------------------------------------------------------
# Minimal compose for building the image from the local Dockerfile and testing
# that it starts. NO CasaOS metadata, NO Docker Hub image pull — it builds here.
#
# Usage:
#   docker compose -f docker-compose.build.yml build
#   docker compose -f docker-compose.build.yml up            # foreground, see logs
#   docker compose -f docker-compose.build.yml up -d         # detached
#   docker compose -f docker-compose.build.yml logs -f       # follow logs
#   docker compose -f docker-compose.build.yml down          # stop + remove
#
# Uses network_mode: host (same as production) so you reproduce the real startup
# path. If WEB_PORT/VNC_PORT are busy on the host, override them inline, e.g.:
#   WEB_PORT=38080 docker compose -f docker-compose.build.yml up
# =============================================================================
name: steam-headless-lite-build

services:
  steam-headless-lite:
    build:
      context: .
      dockerfile: Dockerfile
    image: steam-client-headless-lite:local
    container_name: steam-headless-lite-build
    network_mode: host
    # Steam's runtime sandbox (bubblewrap / pressure-vessel) needs to create
    # nested user namespaces, or it aborts with
    # "Steam now requires user namespaces to be enabled."
    # Docker's default seccomp + AppArmor profiles block that inside a container,
    # so relax both and grant SYS_ADMIN. The host already allows unprivileged
    # userns (kernel.unprivileged_userns_clone=1), so no host sysctl is needed.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - SYS_ADMIN
    # Chromium/CEF (steamwebhelper) + SwiftShader need a large /dev/shm. Docker's
    # 64MB default makes the GPU process crash on init ("Exiting GPU process due
    # to errors during initialization"), leaving the Steam UI black. 2GB is ample.
    shm_size: "2gb"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=${TZ:-Etc/UTC}
      - WEB_PORT=${WEB_PORT:-28080}
      - VNC_PORT=${VNC_PORT:-28090}
      - SCREEN_RES=1280x800x24
      - VNC_EXPOSE=false
      - VNC_PASSWORD=
      # If you mount an existing/de-migrated library (already owned by PUID:PGID),
      # set CHOWN_ON_START=false to skip the recursive chown (slow on large libs).
      - CHOWN_ON_START=${CHOWN_ON_START:-true}
    volumes:
      # Steam session/config (keeps you logged in). Local bind for debugging.
      - ./.local/config:/config
      # Library mounted as /data. Defaults to a local test dir; override with the
      # DATA_DIR env var to point at a real (e.g. de-migrated) SteamLibrary, e.g.:
      #   DATA_DIR=/srv/SteamLibrary docker compose -f docker-compose.build.yml up
      - ${DATA_DIR:-./.local/data}:/data
    restart: "no"
